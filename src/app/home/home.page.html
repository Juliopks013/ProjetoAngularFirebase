<ion-content [fullscreen]="true">

    <ion-row>
        <ng-container *ngFor="let article of this.articles">
            <ion-col size="12" size-lg="4">
                <ion-card>
                    <ion-card-header>
                        <ion-card-title>
                            Título: {{ article.title }}
                        </ion-card-title>
                        <ion-card-subtitle>
                            Autor: {{ article.author }}
                        </ion-card-subtitle>
                    </ion-card-header>
                    <ion-card-content>
                        <img src="{{ article.urlToImage }}">
                        {{ article.content }}
                    </ion-card-content>
                </ion-card>
            </ion-col>
        </ng-container>
    </ion-row>
    
    
</ion-content>
